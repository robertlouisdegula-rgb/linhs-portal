
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# Automatically creates or updates your database tables based on your models
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your logs (helpful for debugging)
spring.jpa.show-sql=true

# Formats the SQL in the logs to be readable
spring.jpa.properties.hibernate.format_sql=true

# (Optional but recommended) Specify the dialect if you are using PostgreSQL on Render
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Set the maximum file upload size limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
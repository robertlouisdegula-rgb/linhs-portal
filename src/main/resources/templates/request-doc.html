<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Request Gateway | LINHS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0d0d0d;
            --panel-bg: #161616;
            --border-color: #2a2a2a;
            --mint-green: #20c997;
            --mint-hover: #1aa078;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --input-bg: #0a0a0a;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .request-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-control, .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--input-bg);
            border-color: var(--mint-green);
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-primary {
            background-color: var(--mint-green);
            border-color: var(--mint-green);
            color: #000;
            font-weight: 600;
            padding: 12px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--mint-hover);
            border-color: var(--mint-hover);
        }
    </style>
</head>

<body>
    <div class="request-container">
        <div class="text-center mb-4">
            <i class="fas fa-file-signature fa-3x mb-3" style="color: var(--mint-green);"></i>
            <h3 class="fw-bold">Document Request Portal</h3>
            <p class="text-muted">Submit a formal request for academic records and credentials.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger bg-danger text-white border-0" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success bg-success text-white border-0" th:text="${successMessage}"></div>

        <form action="/request-document/submit" method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label text-muted small">First Name</label>
                <input type="text" name="firstName" class="form-control" required placeholder="Legal First Name">
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small">Last Name</label>
                <input type="text" name="lastName" class="form-control" required placeholder="Legal Last Name">
            </div>

            <div class="col-md-4">
                <label class="form-label text-muted small">Email Address</label>
                <input type="email" name="emailAddress" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="col-md-4">
                <label class="form-label text-muted small">Academic Year</label>
                <input type="text" name="academicYear" class="form-control" required placeholder="e.g., 2023-2024">
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small">Grade & Section</label>
                <input type="text" name="gradeSection" class="form-control" required placeholder="e.g., Grade 10 - Rizal">
            </div>

            <div class="col-12">
                <label class="form-label text-muted small">Requested Document</label>
                <select name="documentType" class="form-select" required>
                    <option value="" disabled selected>-- Select Document Type --</option>
                    <option value="Certificate of Enrollment">Certificate of Enrollment</option>
                    <option value="Certified True Copy - SF 9 (Card)">Certified True Copy - SF 9 (Card)</option>
                    <option value="Photocopy of SF9 (Card)">Photocopy of SF9 (Card)</option>
                    <option value="Photocopy of SF10 (Permanent Record)">Photocopy of SF10 (Permanent Record)</option>
                    <option value="Original SF10 (Permanent Record)">Original SF10 (Permanent Record)</option>
                    <option value="Good Moral Certificate">Good Moral Certificate</option>
                </select>
            </div>

            <div class="col-12">
                <label class="form-label font-semibold" style="color: var(--mint-green);">Official Purpose of Document Request</label>
                <textarea name="purpose" class="form-control" rows="3"
                    placeholder="Type intent reason (e.g., Scholarship application, Permanent transfer)" required></textarea>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i> Dispatch Request Form</button>
            </div>

            <div class="col-12 text-center mt-3">
                <a href="/login" class="text-muted text-xs text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Return to Main Portal Login</a>
            </div>
        </form>
    </div>
</body>

</html>

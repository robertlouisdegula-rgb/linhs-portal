<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | LINHS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#090d0a', cardBg: '#111612', emeraldAccent: '#10b981' } } } }
    </script>
</head>
<body class="bg-darkBg text-white antialiased font-sans">
    
    <nav class="flex items-center justify-between px-8 py-4 border-b border-zinc-800 bg-cardBg">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emeraldAccent/20 rounded flex items-center justify-center text-xs font-bold text-emeraldAccent">PORTAL</div>
            <h1 class="text-sm font-bold tracking-wide">Teacher Dashboard</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-zinc-400" th:text="${user.email}">teacher@linhs.edu.ph</span>
            <a href="/logout" class="text-xs font-semibold text-red-400 bg-red-400/10 hover:bg-red-400/20 px-3 py-1.5 rounded transition">Logout</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="mb-8 border-b border-zinc-800 pb-6">
            <h2 class="text-3xl font-bold">Welcome back, <span th:text="${user.name}" class="text-emeraldAccent">Teacher</span>!</h2>
            <p class="text-zinc-400 mt-1">Role: <span th:text="${user.role}" class="uppercase text-xs bg-zinc-800 px-2 py-0.5 rounded ml-1">ROLE</span></p>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
            <div class="bg-cardBg p-6 rounded-xl border border-zinc-800">
                <h3 class="text-lg font-bold mb-2">Pending Clearances</h3>
                <p class="text-3xl font-bold text-emeraldAccent">12</p>
                <button class="mt-4 w-full bg-zinc-800 hover:bg-zinc-700 py-2 rounded text-sm transition">Review</button>
            </div>
            
            <div class="bg-cardBg p-6 rounded-xl border border-zinc-800">
                <h3 class="text-lg font-bold mb-2">Document Requests</h3>
                <p class="text-3xl font-bold text-emeraldAccent">5</p>
                <button class="mt-4 w-full bg-zinc-800 hover:bg-zinc-700 py-2 rounded text-sm transition">Manage</button>
            </div>
        </div>
    </main>

</body>
</html>

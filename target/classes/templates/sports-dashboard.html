<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Admin Dashboard | LINHS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0d0d0d;
            --panel-bg: #161616;
            --border-color: #2a2a2a;
            --mint-green: #20c997;
            --mint-hover: #1aa078;
            --text-main: #ffffff;
            /* Crisp absolute white */
            --text-muted: #b5b5b5;
            /* Lightened from dark gray to prevent fading */
            --input-bg: #0a0a0a;
            --accent-orange: #ff9800;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .navbar {
            background-color: var(--dark-bg) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .panel-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-control,
        .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main) !important;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: var(--input-bg);
            border-color: var(--mint-green);
            color: var(--text-main) !important;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }

        /* Forces clean dropdown background and white name text */
        .form-select option {
            background-color: var(--panel-bg) !important;
            color: var(--text-main) !important;
        }

        .btn-mint {
            background-color: var(--mint-green);
            color: #fff !important;
            font-weight: 600;
        }

        .btn-mint:hover {
            background-color: var(--mint-hover);
            color: #fff !important;
        }

        .table {
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: var(--text-muted) !important;
            border-bottom-width: 2px;
        }

        .table tbody td {
            color: var(--text-main) !important;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .section-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .section-btn.active {
            background-color: rgba(32, 201, 151, 0.1);
            border-color: var(--mint-green);
            color: var(--mint-green);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fas fa-running text-danger fs-4"></i>
                <span class="fw-bold tracking-tight">LINHS <span
                        class="text-danger text-xs font-mono">SPORTS</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-md-block">
                    <div class="text-sm font-semibold text-white" th:text="${adminName}">Sports Admin</div>
                    <div class="text-xs text-muted">Athletic Director & Vault Officer</div>
                </div>
                <a href="/logout" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show bg-opacity-10 text-success border border-success"
            role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}">Vault configuration records
                updated.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="panel-card">
                    <h5 class="mb-4 font-bold text-lg d-flex align-items-center gap-2"
                        style="color: var(--mint-green);">
                        <i class="fas fa-plus-circle"></i> Log Vault Borrow Record
                    </h5>
                    <form th:action="@{/sports/log}" method="POST">
                        <input type="hidden" name="studentName" class="hiddenStudentName" value="" />
                        <div class="mb-3">
                            <label class="form-label text-xs font-semibold text-muted">Select Target Accountable
                                Student</label>
                            <select name="lrn" class="form-select select2-setup" onchange="updateHiddenName(this)"
                                required>
                                <option value="" disabled selected style="color: var(--text-muted);">Choose student
                                    registry...</option>
                                <option th:each="student : ${students}" th:value="${student.lrn}"
                                    th:text="${student.name} + ' (' + ${student.lrn} + ')'"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-xs font-semibold text-muted">Athletic Vault Equipment Borrow
                                Records</label>
                            <textarea name="equipmentDetails" class="form-control" rows="4"
                                placeholder="Specify athletic equipment details, uniform pieces, equipment serials, or vault inventory holdings..."
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-mint w-100 py-2"><i class="fas fa-running me-1"></i> Log
                            Vault Borrow</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="m-0 fw-bold tracking-tight text-white">Active Vault Borrow Accountabilities</h4>
                    <div class="d-flex gap-2">
                        <button class="section-btn active" id="btn-active" onclick="showSection('active')">Outstanding
                            Borrows</button>
                    </div>
                </div>

                <div class="panel-card student-table-container" id="table-active">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle m-0">
                            <thead>
                                <tr>
                                    <th>LRN</th>
                                    <th>Student Name</th>
                                    <th>Athletic Vault Equipment Borrow Records</th>
                                    <th>Logged At</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${activeBorrows}">
                                    <td class="font-mono text-xs fw-bold" th:text="${log.lrn}"></td>
                                    <td class="text-white fw-semibold" th:text="${log.studentName}"></td>
                                    <td th:text="${log.equipmentDetails}"></td>
                                    <td>
                                        <span class="badge bg-info"
                                            th:text="${log.loggedAt != null ? #temporals.format(log.loggedAt, 'yyyy-MM-dd | hh:mm a') : 'N/A'}"></span>
                                    </td>
                                    <td>
                                        <form th:action="@{/sports/return}" method="POST">
                                            <input type="hidden" name="id" th:value="${log.id}" />
                                            <button type="submit" class="btn btn-sm btn-outline-success"><i
                                                    class="fas fa-check-double me-1"></i> Confirm Vault Return</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(activeBorrows)}">
                                    <td colspan="5" class="text-muted py-4 text-center">No outstanding athletic
                                        equipment assets in circulation.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.student-table-container').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.section-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('table-' + sectionId).style.display = 'block';
            document.getElementById('btn-' + sectionId).classList.add('active');
        }
        function updateHiddenName(selectElement) {
            const selectedText = selectElement.options[selectElement.selectedIndex].text;
            const nameOnly = selectedText.substring(0, selectedText.lastIndexOf(' ('));
            selectElement.closest('form').querySelector('.hiddenStudentName').value = nameOnly;
        }
    </script>
</body>

</html>

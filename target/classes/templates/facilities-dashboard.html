<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilities Dashboard | LINHS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0d0d0d;
            --panel-bg: #161616;
            --border-color: #2a2a2a;
            --mint-green: #20c997;
            --mint-hover: #1aa078;
            --text-main: #f8f9fa;
            --text-muted: #8b8b8b;
            --input-bg: #0a0a0a;
            --accent-orange: #ff9800;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .navbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .dashboard-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .form-control, .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--input-bg);
            border-color: var(--mint-green);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }

        .btn-mint {
            background-color: var(--mint-green);
            color: #000;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-mint:hover {
            background-color: var(--mint-hover);
            color: #000;
        }

        .section-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            margin-right: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .section-btn.active {
            background-color: rgba(32, 201, 151, 0.1);
            color: var(--mint-green);
            border-color: var(--mint-green);
        }

        .table {
            color: var(--text-main);
            vertical-align: middle;
        }

        .table th {
            border-bottom: 2px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .table td {
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-uppercase tracking-wider">
                <i class="fas fa-tools me-2 text-success"></i>LINHS Facilities Portal
            </span>
            <div class="d-flex align-items-center">
                <span class="text-muted me-3" th:text="${session.user != null ? session.user.name : 'Logistics Admin'}">Admin</span>
                <a href="/logout" class="btn btn-outline-danger btn-sm rounded-3"><i class="fas fa-sign-out-alt me-1"></i> Exit</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row">
            <div class="col-xl-4 col-lg-5">
                <div class="dashboard-card">
                    <h5 class="fw-bold mb-4" style="color: var(--mint-green);"><i class="fas fa-exclamation-triangle me-2"></i>Log Property Liability</h5>
                    <form th:action="@{/facilities/report-liability}" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Select Target Student</label>
                            <select name="studentLrn" class="form-select" onchange="updateHiddenName(this)" required>
                                <option value="" disabled selected>Choose target student...</option>
                                <th:block th:each="secEntry : ${sectionsMap}">
                                    <optgroup th:label="${secEntry.key}">
                                        <option th:each="student : ${secEntry.value}" 
                                                th:value="${student.lrn}" 
                                                th:text="${student.name} + ' (' + ${student.lrn} + ')'"></option>
                                    </optgroup>
                                </th:block>
                            </select>
                            <input type="hidden" name="studentName" class="hiddenStudentName">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Asset or Facility Name</label>
                            <input type="text" name="facilityOrItem" class="form-control" placeholder="e.g., Computer Unit 14, Science Lab Glassware" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Damage Incidient Details</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Describe the physical damages or unresolved accountabilities..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-mint w-100 py-2 mt-2"><i class="fas fa-save me-2"></i>File Liability Flag</button>
                    </form>
                </div>
            </div>

            <div class="col-xl-8 col-lg-7">
                <div class="dashboard-card">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                        <div>
                            <h5 class="fw-bold mb-1">Laboratory & Property Clearance Control</h5>
                            <p class="text-muted small mb-0">Toggle sections and audit structural clearance indicators instantly.</p>
                        </div>
                        <div class="position-relative" style="width: 280px;">
                            <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                            <input type="text" id="dashboardSearch" class="form-control ps-5 rounded-pill" placeholder="Search students by LRN or Name...">
                        </div>
                    </div>

                    <div class="d-flex flex-wrap mb-4">
                        <button th:each="secEntry, stat : ${sectionsMap}" 
                                th:id="'btn-' + ${#strings.replace(secEntry.key, ' ', '_')}"
                                th:classappend="${stat.index == 0} ? 'active' : ''"
                                class="section-btn"
                                th:onclick="showSection([[${#strings.replace(secEntry.key, ' ', '_')}]])">
                            <i class="fas fa-folder me-1"></i> <span th:text="${secEntry.key}"></span>
                        </button>
                    </div>

                    <div th:each="secEntry, stat : ${sectionsMap}" 
                         th:id="'table-' + ${#strings.replace(secEntry.key, ' ', '_')}" 
                         class="student-table-container table-responsive" 
                         th:style="${stat.index == 0} ? 'display: block;' : 'display: none;'">
                        
                        <table class="table alignment-middle">
                            <thead>
                                <tr>
                                    <th>LRN Identification</th>
                                    <th>Student Full Name</th>
                                    <th class="text-end">Laboratory Status Flags</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="student : ${secEntry.value}" class="student-row">
                                    <td class="fw-bold text-success search-lrn" th:text="${student.lrn}"></td>
                                    <td class="search-name" th:text="${student.name}"></td>
                                    <td class="text-end">
                                        <form th:action="@{/facilities/update-clearance}" method="POST" class="d-inline-block">
                                            <input type="hidden" name="studentLrn" th:value="${student.lrn}">
                                            <select name="status" class="form-select form-select-sm d-inline-block w-auto border-secondary" onchange="this.form.submit()">
                                                <option th:selected="${student.labClearance == null || student.labClearance.name() == 'PENDING'}" value="PENDING">Pending Accountability</option>
                                                <option th:selected="${student.labClearance?.name() == 'CLEARED'}" value="CLEARED">Cleared Status</option>
                                            </select>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(secEntry.value)}" class="no-data-row">
                                    <td colspan="3" class="text-muted text-center py-4">No rostered students found within this program module.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.student-table-container').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.section-btn').forEach(el => el.classList.remove('active'));
            
            const activeTable = document.getElementById('table-' + sectionId);
            if(activeTable) activeTable.style.display = 'block';
            
            const activeBtn = document.getElementById('btn-' + sectionId);
            if(activeBtn) activeBtn.classList.add('active');

            // Reset current search text on section change to prevent view mismatches
            document.getElementById('dashboardSearch').value = '';
            document.querySelectorAll('.student-row').forEach(row => row.style.display = '');
        }

        function updateHiddenName(selectElement) {
            const selectedText = selectElement.options[selectElement.selectedIndex].text;
            const nameOnly = selectedText.substring(0, selectedText.lastIndexOf(' ('));
            selectElement.closest('form').querySelector('.hiddenStudentName').value = nameOnly;
        }

        // Live Search Input Logic targeting across tables
        document.getElementById('dashboardSearch').addEventListener('keyup', function () {
            let filter = this.value.toLowerCase().trim();
            // Target the student rows inside the currently displayed table layout
            let activeContainer = document.querySelector('.student-table-container[style*="display: block"]');
            if (!activeContainer) activeContainer = document.querySelector('.student-table-container:not([style*="display: none"])');
            
            if (activeContainer) {
                let rows = activeContainer.querySelectorAll('.student-row');
                rows.forEach(row => {
                    let lrnText = row.querySelector('.search-lrn').textContent.toLowerCase();
                    let nameText = row.querySelector('.search-name').textContent.toLowerCase();
                    if (lrnText.includes(filter) || nameText.includes(filter)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>

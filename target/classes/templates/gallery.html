<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Gallery | LINHS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { darkBg: '#090d0a', cardBg: '#111612', emeraldAccent: '#10b981', goldAccent: '#fbbf24' } 
                } 
            } 
        }
    </script>
    <style>
        .swiper-button-next, .swiper-button-prev {
            color: #10b981 !important;
            background: rgba(17, 22, 18, 0.8);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .swiper-button-next:after, .swiper-button-prev:after { font-size: 18px !important; font-weight: bold; }
        .swiper-pagination-bullet-active { background: #10b981 !important; }
        .swiper-pagination-bullet { background: #4b5563; }
    </style>
</head>
<body class="bg-darkBg text-white antialiased font-sans">

    <nav class="flex items-center justify-between px-8 py-4 border-b border-zinc-800 bg-darkBg/90 backdrop-blur sticky top-0 z-50">
        <a href="/" class="flex items-center gap-3 w-1/3 group">
            <img src="/lumbanglogo.jpg" alt="LINHS Logo" class="w-10 h-10 object-cover rounded-full">
            <div>
                <h1 class="text-sm font-bold tracking-wide group-hover:text-emeraldAccent transition">LINHS</h1>
                <p class="text-[10px] text-zinc-400">Lumbang Integrated NHS</p>
            </div>
        </a>
        <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 items-center gap-6 text-sm text-zinc-300">
            <a href="/" class="hover:text-emeraldAccent transition">Home</a>
            <a href="/about" class="hover:text-emeraldAccent transition">About</a>
            <a href="/announcements" class="hover:text-emeraldAccent transition">Announcements</a>
            <a href="/resources" class="hover:text-emeraldAccent transition">Resources</a>
            <a href="/gallery" class="text-emeraldAccent font-semibold">Gallery</a>
        </div>
        <div class="flex justify-end w-1/3">
            <a href="/teacher-portal" class="border border-emeraldAccent/30 text-emeraldAccent bg-emeraldAccent/5 hover:bg-emeraldAccent/20 px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <span>→</span> Teacher Portal
            </a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-16 text-center">
        <h2 class="text-3xl font-extrabold tracking-tight text-emeraldAccent mb-2">Campus Life</h2>
        <p class="text-zinc-400 mb-12">Snapshots of excellence, culture, and events across our institution.</p>
        
        <div th:unless="${#lists.isEmpty(galleryItems)}" class="swiper myGallery SwiperContainer select-none max-w-4xl mx-auto">
            <div class="swiper-wrapper">
                <div th:each="item : ${galleryItems}" class="swiper-slide px-4">
                    <div class="bg-cardBg aspect-video rounded-2xl border border-zinc-800 overflow-hidden flex flex-col items-center justify-center text-zinc-400 relative shadow-2xl transition hover:border-emeraldAccent/30 group">
                        <img th:src="${item.imagePath}" th:alt="${item.title}" class="w-full h-full object-cover absolute inset-0 z-0 opacity-60 group-hover:opacity-80 transition" />
                        <div class="relative z-10 p-8 flex flex-col items-center bg-gradient-to-t from-darkBg via-transparent to-transparent w-full h-full justify-end">
                            <span th:text="${item.title}" class="text-lg font-medium tracking-wide text-white drop-shadow-md">Asset Caption</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="swiper-button-next hidden sm:flex"></div>
            <div class="swiper-button-prev hidden sm:flex"></div>
            <div class="swiper-pagination mt-8 !position-relative"></div>
        </div>

        <div th:if="${#lists.isEmpty(galleryItems)}" class="max-w-md mx-auto py-16 border border-dashed border-zinc-800 rounded-2xl">
            <p class="text-zinc-500 text-sm">The digital photographic roll is currently clear.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        if(document.querySelector('.myGallery')) {
            const swiper = new Swiper('.myGallery', {
                loop: true,
                grabCursor: true,
                spaceBetween: 20,
                slidesPerView: 1,
                pagination: { el: '.swiper-pagination', clickable: true, dynamicBullets: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            });
        }
    </script>
</body>
</html>

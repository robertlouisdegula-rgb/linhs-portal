<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINHS Portal - Authenticate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --dark-green-bg: #090d0a;
            --panel-green: #111612;
            --accent-gold: #fbbf24;
            --text-light: #ffffff;
            --text-muted: #a1a1aa;
            --emerald-label: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-green-bg);
            font-family: 'Poppins', sans-serif;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .watermark-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
        }
        
        .watermark-bg img {
            width: 80%;
            max-width: 800px;
            object-fit: contain;
            filter: grayscale(100%);
        }

        .login-card {
            background-color: var(--panel-green);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 1;
            position: relative;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--emerald-label);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-light);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--emerald-label);
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        /* Password Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 45px; /* Ensures text doesn't type under the icon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            outline: none;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-light);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            margin-top: 1rem;
            background-color: var(--emerald-label);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0ea5e9;
            color: white;
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-gold);
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #111612 inset !important;
            -webkit-text-fill-color: var(--text-light) !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        input:-webkit-autofill {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input:-webkit-autofill:focus {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Floating Top-Center Toasts */
        .toast-notification {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            min-width: 320px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast-danger {
            background-color: rgba(239, 68, 68, 0.95);
            color: white;
            border: 1px solid #ef4444;
        }

        .toast-success {
            background-color: rgba(16, 185, 129, 0.95);
            color: white;
            border: 1px solid #10b981;
        }

        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 30px; opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="toast-notification toast-danger" th:if="${error}">
        <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
    </div>
    <div class="toast-notification toast-danger" th:if="${errorMessage}">
        <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div class="toast-notification toast-success" th:if="${logoutMessage}">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${logoutMessage}"></span>
    </div>

    <div class="watermark-bg">
        <img src="/lumbanglogo.jpg" alt="Watermark Background">
    </div>

    <div class="login-card">
        
        <div class="logo-container">
            <img src="/lumbanglogo.jpg" alt="LINHS Emblem">
        </div>
            
        <h2>LINHS Portal</h2>
        <p class="subtitle">Sign in to access your administrative dashboard</p>

        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label for="username">Username / LRN / Email</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your credentials">
            </div>
            
            <div class="form-group">
                <label for="password">Security Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    <button type="button" class="toggle-password" id="togglePasswordBtn" title="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Authenticate Identity</button>
        </form>
        
        <a href="/" class="back-link">&larr; Return to Public Portal</a>
    </div>

    <script>
        // Toggle Password Visibility
        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });

        // Auto-dismiss floating toasts after 4 seconds
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                const toasts = document.querySelectorAll('.toast-notification');
                toasts.forEach(toast => {
                    // Smoothly slide up and fade out
                    toast.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(-20px)';
                    
                    // Remove from DOM entirely
                    setTimeout(() => toast.remove(), 500);
                });
            }, 4000);
        });
    </script>
</body>
</html>

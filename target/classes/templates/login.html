<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINHS Portal - Authenticate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green-bg: #090d0a;
            --panel-green: #111612;
            --accent-gold: #fbbf24;
            --text-light: #ffffff;
            --text-muted: #a1a1aa;
            --emerald-label: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-green-bg);
            font-family: 'Poppins', sans-serif;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Full Screen Low Opacity Background Watermark Layer */
        .watermark-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
        }
        
        .watermark-bg img {
            width: 80%;
            max-width: 800px;
            object-fit: contain;
            filter: grayscale(100%);
        }

        .login-card {
            background-color: var(--panel-green);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 1;
            position: relative;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--emerald-label);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-light);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--emerald-label);
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            margin-top: 1rem;
            background-color: var(--emerald-label);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0ea5e9;
            color: white;
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-gold);
        }

        .alert {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #111612 inset !important;
            -webkit-text-fill-color: var(--text-light) !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        /* Apply border fix for autofill to blend in */
        input:-webkit-autofill {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input:-webkit-autofill:focus {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="watermark-bg">
        <img src="/lumbanglogo.jpg" alt="Watermark Background">
    </div>

    <div class="login-card">
        
        <div class="logo-container">
            <img src="/lumbanglogo.jpg" alt="LINHS Emblem">
        </div>
            
        <h2>LINHS Portal</h2>
        <p class="subtitle">Sign in to access your administrative dashboard</p>

        <div class="alert alert-success" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="username" required autocomplete="username" placeholder="yourname@domain.com">
            </div>
            
            <div class="form-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Authenticate Identity</button>
        </form>
        
        <a href="/" class="back-link">&larr; Return to Public Portal</a>
    </div>

</body>
</html>

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linhs_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# 1. Explicitly tell Spring to use the PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Explicitly tell Hibernate to use the PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. Use update instead of create to preserve data on restart
spring.jpa.hibernate.ddl-auto=update

# 4. Show SQL queries for debugging (disable in production if needed)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# 5. Connection pool settings for stability
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# 6. Application settings
server.port=${SERVER_PORT:8080}
spring.application.name=linhs-portal

# 7. Thymeleaf settings
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# 8. Logging configuration
logging.level.root=INFO
logging.level.com.linhs.portal=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN

# 9. Session management
server.servlet.session.timeout=30m